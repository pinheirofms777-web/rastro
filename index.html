<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rastro</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#151618">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rastro">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#151618;--panel:#1d1e21;--line:#2b2c30;--txt:#ececec;--mut:#85878d;--g:#00ba4a;--r:#ff3b30;--c:#38393d;--f:#232427}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%;height:var(--H,100%);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:active,.cell:active,.dot:active,.tx:active,.chev:active,.tab:active{opacity:.55;transition:opacity 0s}
html,body{margin:0;background:#151618;color:var(--txt);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
#app{max-width:430px;height:var(--H,100%);margin:0 auto;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
header{position:relative;overflow:hidden;padding:calc(env(safe-area-inset-top) + 18px) 20px 12px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line)}
.sub{font-size:13px;line-height:16px;font-weight:500;color:#a4a6ac;letter-spacing:.02em}
h1{margin:2px 0 0;font-size:30px;line-height:40px;font-weight:700}
.hb{display:flex;gap:6px;align-items:center;position:relative;z-index:3}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.ib{width:38px;height:38px;border-radius:10px;font-size:22px;color:var(--txt);background:var(--panel)}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:12px;touch-action:pan-y;will-change:transform}
.hl{-webkit-font-smoothing:antialiased}
@keyframes inL{from{transform:translateX(-28%);opacity:0}}
@keyframes inR{from{transform:translateX(28%);opacity:0}}
main.inL{animation:inL .12s ease-out}main.inR{animation:inR .12s ease-out}
.pager{z-index:2;position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 76px);display:flex;justify-content:center;pointer-events:none}
.pager div{display:flex;gap:8px;background:rgba(40,41,45,.92);padding:9px 14px;border-radius:20px}
.pager i{width:7px;height:7px;border-radius:50%;background:#5a5c62}.pager i.on{background:#fff}
.ib:disabled{opacity:.25;cursor:default}
.row{padding:16px 20px;border-bottom:1px solid var(--line)}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:15px}
.rh .nm{cursor:pointer}
.p{font-size:13px;margin-left:8px}.p.g{color:var(--g)}.p.r{color:var(--r)}
.today{display:flex;align-items:center;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--txt);flex:none;display:grid;place-items:center}
.dot.g{background:var(--g);border-color:#fff;box-shadow:inset 0 0 0 2.5px var(--bg)}.dot.r{background:var(--r);border-color:#fff;box-shadow:inset 0 0 0 2.5px var(--bg)}
.tx{flex:1;cursor:pointer}.tx small{display:block;color:var(--mut);margin-top:3px;font-size:12px}
.chev{color:var(--mut);cursor:pointer;padding:8px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wk .cell{height:54px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:#c9cacd}.wk .cell b{font-weight:500;font-size:11px;opacity:.7}
.cell{background:var(--c)}.cell.f{background:var(--f);color:#55565b}.cell.g{background:var(--g);color:#032b12}.cell.r{background:var(--r);color:#3a0704}.cell.t{outline:1.5px solid var(--txt);outline-offset:-1.5px}
.mg .cell.g,.mg .cell.r{color:#04210f}.mg .cell.f{color:#55565b}.mg{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}.mg .cell{aspect-ratio:1;border-radius:5px;display:grid;place-items:center;font-size:10px;color:#c9cacd}
.yc{display:block}
.nav{display:flex;gap:4px}
.tabs{display:flex;justify-content:space-around;padding:10px 0 calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line);background:var(--bg)}
.tab{padding:8px 18px;border-radius:10px;color:#6c6e74}.tab.on{color:#fff;background:#2a2b2f}
.tab svg{display:block}
.shade{z-index:5;position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet{background:var(--panel);width:100%;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 20px calc(env(safe-area-inset-bottom) + 24px);animation:up .16s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:3px;background:#55565b;margin:0 auto 14px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh b{font-size:17px}.lnk{color:var(--txt);font-size:14px}
.seg{display:flex;justify-content:center;gap:28px;margin:6px 0 16px;font-size:13px}
.seg span{color:#66686e;cursor:pointer;padding:6px}.seg span.on{color:#fff}
.mr{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12px}.mr i{width:34px;font-style:normal}
.bars{display:flex;gap:2px;flex:1}.bars b{flex:1;height:20px;border-radius:2px;background:var(--c)}
.bars b.g{background:var(--g)}.bars b.r{background:var(--r)}.bars b.f{background:var(--f)}.bars b.x{background:transparent}
input[type=text],input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:16px;padding:12px;border-radius:10px;margin:8px 0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.opt{padding:12px;border-radius:10px;border:1px solid var(--line);text-align:center;font-size:14px}
.opt.g{background:var(--g);color:#0b2a17;border-color:var(--g)}.opt.r{background:var(--r);color:#2b0909;border-color:var(--r)}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--txt);color:#111;font-weight:700;font-size:15px}
.btn.d{background:var(--r);color:#fff;margin-top:10px}
.empty{padding:60px 30px;text-align:center;color:var(--mut);font-size:14px;line-height:1.6}
.mshade{background:transparent;align-items:flex-start;justify-content:flex-end}
.menu{margin:calc(env(safe-area-inset-top) + 64px) 14px 0 0;width:240px;background:#2d2e32;border-radius:16px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mi{padding:12px;display:flex;gap:12px;align-items:center;font-size:15px;cursor:pointer;border-radius:10px}
.mi i{width:18px;font-style:normal;text-align:center}
.ml{font-size:12px;color:var(--mut);padding:10px 12px 4px;border-top:1px solid var(--line);margin-top:6px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.sr span:last-child{color:var(--mut)}
.ro{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);font-size:15px;user-select:none;-webkit-user-select:none}
.ro.drag{background:#2b2c31;border-radius:8px}
.hd{touch-action:none;cursor:grab;padding:10px 6px 10px 20px;color:var(--mut);font-size:22px;line-height:1}
.trash{padding:6px 10px;border-radius:8px;color:var(--mut);font-size:13px;cursor:pointer}.trash.c{background:var(--r);color:#fff}
.tk{padding:6px 20px 24px}
.tkh{display:flex;justify-content:space-between;align-items:center;padding:18px 0 8px;font-size:12px;color:var(--mut);letter-spacing:.06em}
.tkh span:last-child{cursor:pointer;padding:6px 0 6px 12px}
.tkr{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.tkb{width:24px;height:24px;border-radius:7px;border:2px solid var(--mut);flex:none;display:grid;place-items:center;cursor:pointer}
.tkb.on{background:var(--txt);border-color:var(--txt);color:#111}
.tedit{flex:1;min-width:0;margin:0;padding:6px 8px;font-size:16px;border-radius:8px}
.tkt{flex:1;font-size:15px;line-height:1.35;word-break:break-word}
.tkr.d .tkt{color:var(--mut);text-decoration:line-through}
.tkx{color:var(--mut);padding:6px 4px 6px 10px;font-size:18px;cursor:pointer;line-height:1}
.tka{display:flex;gap:8px;margin-top:12px}
.tka input{flex:1;margin:0;padding:11px 12px;font-size:16px}
.tka button{width:44px;border-radius:10px;background:var(--panel);font-size:22px}
.load{padding:12px 20px 0;font-size:12px;color:var(--mut)}.load b{color:var(--txt);font-size:14px}
.tkd{font-size:12px;color:var(--mut);padding:6px 4px;white-space:nowrap;cursor:pointer}
.durr{display:flex;gap:8px;align-items:center}.durr input{width:84px;margin:8px 0 14px;flex:none}.durr .opt{flex:1;margin-bottom:6px}
.tks{display:block;color:var(--mut);font-size:11px;margin-top:3px}.tkm{font-size:12px;padding:8px 10px;border-radius:8px;background:var(--panel);cursor:pointer;white-space:nowrap}
.tke{color:var(--mut);font-size:13px;padding:10px 0 4px}
.hd2{font-size:12px;color:var(--mut);letter-spacing:.04em;padding:14px 0 4px;cursor:pointer}
.note{font-size:11px;color:var(--mut);padding:14px 20px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script>
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MS=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const DL=['S','T','Q','Q','S','S','D'];
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addD=(d,n)=>{const x=sod(d);x.setDate(x.getDate()+n);return x};
const TODAY=sod(new Date());
const WS=()=>(D&&D.weekStart!==undefined)?D.weekStart:0;
const monday=d=>addD(d,-((d.getDay()-WS()+7)%7));
const DLF=['D','S','T','Q','Q','S','S'];
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}

function weekNum(m){if(WS()===1)return isoWeek(m);const sat=addD(m,6),y=sat.getFullYear(),j=new Date(y,0,1),f=addD(j,-j.getDay());return Math.round((m-f)/6048e5)+1}
/* ---------- estado ---------- */
let D={habits:[],entries:{},seq:1,tasks:[]};
/* ---------- armazenamento: IndexedDB ---------- */
const DB={open(){return new Promise((ok,no)=>{const r=indexedDB.open('rastro',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})},
  async get(k='data'){const db=await this.open();return new Promise((ok,no)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})},
  async set(v,k='data'){const db=await this.open();return new Promise((ok,no)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}};
let svT=0;const persist=()=>{try{stamp()}catch(e){}return DB.set(JSON.parse(JSON.stringify(D))).catch(()=>{})};
const flush=()=>{clearTimeout(svT);svT=0;persist();if(SY.cfg){clearTimeout(SY.t);SY.t=setTimeout(sync,2500)}};
const save=()=>{if(!svT)svT=setTimeout(flush,400)};
addEventListener('pagehide',()=>{if(svT)flush()});
const WD=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const S={tab:'today',day:TODAY,ref:TODAY,anim:'',sheet:null,draft:'',intent:'build'};
const H=id=>D.habits.find(h=>h.id===id);
function list(){
  const m=D.sort||'green',a=[...D.habits],ix=h=>D.habits.indexOf(h),b=h=>h.intent==='build'?0:1;
  if(m==='green')a.sort((x,y)=>b(x)-b(y)||ix(x)-ix(y));
  else if(m==='red')a.sort((x,y)=>b(y)-b(x)||ix(x)-ix(y));
  else if(m==='date')a.sort((x,y)=>(x.created<y.created?-1:x.created>y.created?1:0)||ix(x)-ix(y));
  return a}
const has=(h,k)=>!!D.entries[h.id+'|'+k];

/* ---------- regras ---------- */
function streak(h,ref=TODAY){
  if(h.intent==='build'){let d=has(h,key(ref))?ref:addD(ref,-1),n=0;while(has(h,key(d))){n++;d=addD(d,-1)}return n}
  let d=ref,n=0;const c=h.created;while(key(d)>=c&&!has(h,key(d))){n++;d=addD(d,-1)}return n;
}
function pct(h,from,to){ // registros / dias decorridos
  const end=to>TODAY?TODAY:to;let tot=0,on=0;
  for(let d=from;d<=end;d=addD(d,1)){tot++;if(has(h,key(d)))on++}
  return tot?on/tot*100:null;
}
const fmtP=p=>(Math.round(p*1000)/1000).toFixed(3).replace(/0+$/,'').replace(/\.$/,'').replace('.',',');
const pTxt=(h,a,b)=>{const p=pct(h,a,b);return p===null?'':`<span class="p ${h.intent==='build'?'g':'r'}">${fmtP(p)}%</span>`};
const cls=(h,d)=>d>TODAY?'f':has(h,key(d))?(h.intent==='build'?'g':'r'):'';
const cell=(h,d,txt='',extra='')=>`<div class="cell ${cls(h,d)} ${key(d)===key(TODAY)?'t':''} ${extra}" ${d>TODAY?'':`data-a="toggle" data-h="${h.id}" data-d="${key(d)}"`}>${txt}</div>`;

/* ---------- views ---------- */
const CHECK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
function weekHtml(h,mon,compact){
  let c='';for(let i=0;i<7;i++){const d=addD(mon,i);c+=cell(h,d,`<span>${DLF[d.getDay()]}</span><b>${d.getDate()}</b>`)}return `<div class="wk">${c}</div>`}
function monthHtml(h,y,m){
  const n=new Date(y,m+1,0).getDate();let c='';for(let i=1;i<=n;i++)c+=cell(h,new Date(y,m,i),i);return `<div class="mg">${c}</div>`}
function yearHtml(h,y){return `<canvas class="yc" data-h="${h.id}" data-y="${y}"></canvas>`}
function paintYear(root){
  const cv=root.querySelectorAll('canvas.yc');if(!cv.length)return;
  const cs=getComputedStyle(document.documentElement),col={g:cs.getPropertyValue('--g').trim(),r:cs.getPropertyValue('--r').trim(),f:cs.getPropertyValue('--f').trim(),'':cs.getPropertyValue('--c').trim()};
  const dpr=window.devicePixelRatio||1,N=40,gap=2;
  cv.forEach(c=>{
    const h=H(c.dataset.h),y=+c.dataset.y;if(!h)return;
    const pc=getComputedStyle(c.parentNode),W=Math.floor((c.parentNode.clientWidth||350)-parseFloat(pc.paddingLeft)-parseFloat(pc.paddingRight)),cell=(W-gap*(N-1))/N,n=(new Date(y,11,31)-new Date(y,0,1))/864e5+1,rows=Math.ceil(n/N),Ht=rows*cell+(rows-1)*gap;
    c.style.width=W+'px';c.style.height=Ht+'px';c.width=Math.round(W*dpr);c.height=Math.round(Ht*dpr);
    const x=c.getContext('2d');x.scale(dpr,dpr);
    const P={g:[],r:[],f:[],'':[]};
    for(let i=0;i<n;i++)P[cls(h,new Date(y,0,1+i))].push(i);
    for(const k in P){x.fillStyle=col[k];x.beginPath();for(const i of P[k]){const px=(i%N)*(cell+gap),py=Math.floor(i/N)*(cell+gap);x.rect(px,py,cell,cell)}x.fill()}})}
function yearRows(h,y){
  let o='';for(let m=0;m<12;m++){const n=new Date(y,m+1,0).getDate();let b='';
    for(let i=1;i<=31;i++){if(i>n){b+='<b class="x"></b>';continue}const d=new Date(y,m,i);b+=`<b class="${cls(h,d)}"></b>`}
    o+=`<div class="mr"><i>${MS[m]}</i><div class="bars">${b}</div></div>`}return o}

const tasksOf=k=>(D.tasks||[]).filter(t=>t.day===k);
const dlabel=d=>WD[d.getDay()].slice(0,3)+' · '+pad(d.getDate())+' '+MS[d.getMonth()].toLowerCase();
function parseDur(s,paren){const r=paren?/\((\d+)\s*(pomodoros?|pomos?|min(?:utos?)?|h)\)/i:/\s(\d+)\s*(pomodoros?|pomos?|p|min(?:utos?)?|m|h)$/i,m=s.match(r);if(!m)return null;const n=+m[1],u=m[2].toLowerCase();if(!n)return null;const d=/^p/.test(u)?{n,u:'p'}:u==='h'?{n:n*60,u:'m'}:{n,u:'m'};d.i=m.index;return d}
const fmtDur=d=>d.u==='p'?d.n+' pomo':d.n+' min';
const fmtT=m=>m<60?m+'min':Math.floor(m/60)+'h'+pad(m%60);
const cyc=p=>{let t=p*25;for(let i=1;i<p;i++)t+=i%3?5:10;return t};
function dayLoad(k){let P=0,M=0,Pd=0,Md=0,miss=0;
  const add=(d,done)=>{if(!d||!(d.n>0)){miss++;return}if(d.u==='p'){P+=d.n;if(done)Pd+=d.n}else{M+=d.n;if(done)Md+=d.n}};
  D.habits.filter(h=>h.intent==='build').forEach(h=>add(h.dur,has(h,k)));
  tasksOf(k).forEach(t=>add(t.dur,t.done));
  const tot=cyc(P)+M,fe=cyc(Pd)+Md;return {tot,fe,miss}}
function loadHtml(k){const L=dayLoad(k);if(!L.tot)return '';
  const ms=L.miss?' · '+L.miss+' sem tempo':'';
  if(k>key(TODAY))return `<div class="load">⏱ <b>${fmtT(L.tot)}</b> planejado${ms}</div>`;
  const rest=L.tot-L.fe;
  return `<div class="load">⏱ <b>${fmtT(L.tot)}</b>${L.fe?' · feito '+fmtT(L.fe):''} · ${rest>0?'falta '+fmtT(rest):'concluído'}${ms}</div>`}
function tasksHtml(day){
  const k=key(day),isT=k===key(TODAY),L=tasksOf(k);
  return `<div class="tk"><div class="tkh"><span>${isT?'TAREFAS DE HOJE':'TAREFAS · '+pad(day.getDate())+' '+MS[day.getMonth()]}</span><span data-a="thist">Histórico ›</span></div>
  ${L.map(t=>`<div class="tkr ${t.done?'d':''}"><div class="tkb ${t.done?'on':''}" data-a="tdone" data-t="${t.id}">${t.done?CHECK:''}</div>${S.edit===t.id?`<input type="text" class="tedit" data-t="${t.id}" maxlength="120" value="${t.text.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}">`:`<div class="tkt" data-a="tedit" data-t="${t.id}">${t.text.replace(/</g,'&lt;')}</div>`}<div class="tkd" data-a="tdur" data-t="${t.id}">${t.dur?fmtDur(t.dur):'⏱'}</div><div class="tkx" data-a="tdel" data-t="${t.id}">×</div></div>`).join('')||'<div class="tke">Nenhuma tarefa para este dia.</div>'}
  <div class="tka"><input type="text" class="tin" placeholder="Nova tarefa · ex.: Ligar 30min" maxlength="120" enterkeyhint="done"><button data-a="tadd" aria-label="Adicionar tarefa">+</button></div>${isT?pendHtml(k):''}</div>`}
function pendHtml(k){
  const P=(D.tasks||[]).filter(t=>!t.done&&t.day<k).sort((a,b)=>a.day<b.day?1:a.day>b.day?-1:0);if(!P.length)return '';
  const lab=dk=>{const [y,m,d]=dk.split('-').map(Number);return pad(d)+' '+MS[m-1]};
  return `<div class="tkh" style="margin-top:14px"><span>PENDENTES DE DIAS ANTERIORES</span><span data-a="tall">Trazer todas</span></div>`+P.map(t=>`<div class="tkr"><div class="tkt">${t.text.replace(/</g,'&lt;')}<small class="tks">${lab(t.day)}</small></div><div class="tkm" data-a="tmove" data-t="${t.id}">Trazer para hoje</div></div>`).join('')}
function viewToday(){
  const day=S.day,k=key(day),isT=k===key(TODAY);
  if(k>key(TODAY))return loadHtml(k)+tasksHtml(day);
  const hab=!D.habits.length?'':list().map(h=>{const on=has(h,k),st=streak(h,day);

  if(sh.tdur){const t=(D.tasks||[]).find(x=>x.id===sh.tdur);if(!t)return '';
    return `<div class="shade" data-a="close"><div class="sheet" data-stop><div class="grab"></div>

    <button class="btn" data-a="saveh">Salvar</button>${h?'<button class="btn d" data-a="delh">Excluir hábito</button>':''}</div></div>`}

  if(sh.mode==='week'){const mon=monday(sh.ref);body=weekHtml(h,mon);sub=`Semana ${weekNum(mon)} ${pTxt(h,mon,addD(mon,6))}`}

function canNext(){
  if(S.tab==='today')return key(S.day)<key(addD(TODAY,365));
  if(S.tab==='week')return key(monday(S.ref))<key(monday(TODAY));
  const ym=d=>d.getFullYear()*12+d.getMonth();
  if(S.tab==='month')return ym(S.ref)<ym(TODAY);
  return S.ref.getFullYear()<TODAY.getFullYear()}
function go(dir){
  if(dir>0&&!canNext())return false;
  if(S.tab==='today')S.day=addD(S.day,dir);
  else if(S.tab==='week')S.ref=addD(S.ref,7*dir);
  else S.ref=step(S.ref,S.tab,dir);
  return true}
function pagerHtml(){
  const ym=d=>d.getFullYear()*12+d.getMonth();
  const off=S.tab==='today'?Math.round((TODAY-S.day)/864e5):S.tab==='week'?Math.round((monday(TODAY)-monday(S.ref))/6048e5):S.tab==='month'?ym(TODAY)-ym(S.ref):TODAY.getFullYear()-S.ref.getFullYear();
  const on=((3-off)%4+4)%4;
  return `<div class="pager"><div>${[0,1,2,3].map(i=>`<i class="${i===on?'on':''}"></i>`).join('')}</div></div>`}
function parts(){
  const r=S.ref,t=S.tab;let sub='',title='',v='';
  if(t==='today'){const d=S.day,isT=key(d)===key(TODAY);const fut=key(d)>key(TODAY);sub=WD[d.getDay()]+(isT?' · '+pad(d.getDate())+' '+MS[d.getMonth()].toLowerCase():fut?' · planejado'+(d.getFullYear()!==TODAY.getFullYear()?' '+d.getFullYear():''):'');title=isT?'Hoje':fut&&key(d)===key(addD(TODAY,1))?'Amanhã':d.getDate()+' '+MS[d.getMonth()].toLowerCase();v=viewToday()}
  if(t==='week'){const mon=monday(r);const m2=addD(mon,6).getMonth();sub=MES[mon.getMonth()]+(m2!==mon.getMonth()?' / '+MES[m2]:'');title='Semana '+weekNum(mon);v=viewWeek()}
  if(t==='month'){sub=r.getFullYear();title=MES[r.getMonth()];v=viewMonth()}
  if(t==='year'){sub='';title=r.getFullYear();v=viewYear()}
  return {sub,title,v}}
var nav0=0;
function render(){
  const {sub,title,v}=parts(),t=S.tab;
  const nav=`<button class="ib" data-a="prev">‹</button><button class="ib" data-a="next" ${canNext()?'':'disabled'}>›</button>`;
  const tv=document.querySelector('main .tin')?.value||'',scroll=nav0?0:(document.querySelector('main')?.scrollTop||0),hadSheet=!!document.querySelector('.sheet');
  document.getElementById('app').innerHTML=`<header><div class="hl"><div class="sub">${sub}</div><h1>${title}</h1></div><div class="hb">${nav}<button class="ib" data-a="menu" aria-label="Menu">☰</button></div></header>
  <main class="${S.anim}">${v}</main>
  ${pagerHtml()}<nav class="tabs">${['today','week','month','year'].map(k=>`<button class="tab ${t===k?'on':''}" data-a="tab" data-v="${k}">${ICON[k]}</button>`).join('')}</nav>${sheetHtml()}${menuHtml()}`;
  nav0=0;document.querySelector('main').scrollTop=scroll;paintYear(document.getElementById('app'));
  if(hadSheet)document.querySelectorAll('.sheet').forEach(e=>e.style.animation='none');
  S.anim='';
  if(tv){const n=document.querySelector('main .tin');if(n)n.value=tv}
  if(S.refocusEdit){S.refocusEdit=false;const n=document.querySelector('main .tedit');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
  if(S.refocus){S.refocus=false;const n=document.querySelector('main .tin');if(n)n.focus()}
  const dn=document.getElementById('dn');if(dn)dn.addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,3);S.dn=e.target.value});
  const nm=document.getElementById('nm');if(nm)nm.addEventListener('input',e=>S.draft=e.target.value);
}

/* ---------- ações ---------- */
function step(ref,mode,dir){
  if(mode==='week')return addD(ref,7*dir);
  if(mode==='month')return new Date(ref.getFullYear(),ref.getMonth()+dir,1);
  return new Date(ref.getFullYear()+dir,0,1)}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-stop]')&&!e.target.closest('[data-a]'))return;
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.classList.contains('shade')&&e.target!==el)return;
  const a=el.dataset.a,h=el.dataset.h;
  if(a!=='menu')S.menu=false;
  if(a==='menu'){S.menu=!S.menu}
  else if(a==='closemenu'){}
  else if(a==='setsort'){D.sort=el.dataset.v;save();if(D.sort==='manual')S.sheet={reorder:true,fromMenu:true}}
  else if(a==='settings'||a==='back'){S.sheet={settings:true}}
  else if(a==='mv'){const i=D.habits.findIndex(x=>x.id===h),j=i+(+el.dataset.d);if(j>=0&&j<D.habits.length){[D.habits[i],D.habits[j]]=[D.habits[j],D.habits[i]];D.sort='manual';save()}}
  else if(a==='export'){doExport();return}
  else if(a==='import'){document.getElementById('imp').click();return}
  else if(a==='thist'){S.sheet={thist:true}}
  else if(a==='dunit'){S.du=el.dataset.v}
  else if(a==='tdur'){const t=D.tasks.find(x=>x.id===el.dataset.t);if(t){S.sheet={tdur:t.id};S.dn=t.dur?String(t.dur.n):'';S.du=t.dur?t.dur.u:'m'}}
  else if(a==='tdursave'){const t=D.tasks.find(x=>x.id===S.sheet.tdur),n=parseInt(S.dn,10);if(t){if(n>0)t.dur={n,u:S.du};else delete t.dur;save()}S.sheet=null}
  else if(a==='tdurclear'){const t=D.tasks.find(x=>x.id===S.sheet.tdur);if(t){delete t.dur;save()}S.sheet=null}
  else if(a==='durfill'){const c=D.habits.filter(h=>!h.dur&&h.intent==='build'&&parseDur(h.name,true));
    if(!c.length)alert('Nenhum hábito com duração no nome, como "(2 pomodoros)" ou "(30 min)".');
    else if(confirm('Encontrei duração no nome de '+c.length+' hábito(s). Preencher o campo de duração com esses valores? Os nomes não mudam.')){c.forEach(h=>{const d=parseDur(h.name,true);h.dur={n:d.n,u:d.u}});save()}}
  else if(a==='syncset'){S.sheet={sync:true};SY.msg='';SY.err=SY.cfg?SY.err:''}
  else if(a==='syncnow'){sync().then(()=>render())}
  else if(a==='syncon'){connect();return}
  else if(a==='syncoff'){if(confirm('Desconectar este aparelho? Os dados continuam aqui e na nuvem.')){SY.cfg=null;SY.cache=null;DB.set(null,'cfg').catch(()=>{})}}
  else if(a==='gotoday'){const [y,m,d]=el.dataset.d.split('-').map(Number);nav0=1;S.tab='today';S.day=new Date(y,m-1,d);S.ref=S.day;S.sheet=null}
  else if(a==='tdone'){const t=D.tasks.find(x=>x.id===el.dataset.t);if(t){t.done=!t.done;save()}}
  else if(a==='tmove'){const t=D.tasks.find(x=>x.id===el.dataset.t);if(t){t.day=key(TODAY);save()}}
  else if(a==='tall'){D.tasks.forEach(t=>{if(!t.done&&t.day<key(TODAY))t.day=key(TODAY)});save()}
  else if(a==='tedit'){S.edit=el.dataset.t;S.refocusEdit=true}
  else if(a==='tdel'){D.tasks=D.tasks.filter(x=>x.id!==el.dataset.t);save()}
  else if(a==='tadd'){if(!addTask(el.closest('.tk')))return;S.refocus=true}
  else if(a==='goreorder'){S.sheet={reorder:true}}
  else if(a==='goremove'){S.sheet={remove:true};S.confirm=null}
  else if(a==='ws'){D.weekStart=WS()===0?1:0;save()}
  else if(a==='rm'){if(S.confirm===h){D.habits=D.habits.filter(x=>x.id!==h);Object.keys(D.entries).forEach(k=>{if(k.startsWith(h+'|'))delete D.entries[k]});save();S.confirm=null}else S.confirm=h}
  else if(a==='rmall'){if(S.confirm==='all'){D.habits=[];D.entries={};save();S.confirm=null}else S.confirm='all'}
  else if(a==='tab'){nav0=1;S.tab=el.dataset.v;S.ref=TODAY;S.day=TODAY;S.anim=''}
  else if(a==='toggle'){const k=h+'|'+el.dataset.d;D.entries[k]?delete D.entries[k]:D.entries[k]=1;save()}
  else if(a==='prev'||a==='next'){slide(a==='next'?1:-1);return}
  else if(a==='open'){S.sheet={id:h,mode:S.tab==='week'?'week':S.tab==='month'?'month':'year',ref:S.tab==='today'?TODAY:S.ref}}
  else if(a==='close'){S.sheet=null}
  else if(a==='mode'){S.sheet.mode=el.dataset.v}
  else if(a==='sprev'||a==='snext'){S.sheet.ref=step(S.sheet.ref,S.sheet.mode,a==='snext'?1:-1)}
  else if(a==='add'){S.sheet={add:true};S.draft='';S.intent='build';S.dn='';S.du='p'}
  else if(a==='editsheet'){const x=H(h);S.sheet={edit:h};S.draft=x.name;S.intent=x.intent;const pd=x.dur||parseDur(x.name,true);S.dn=pd?String(pd.n):'';S.du=pd?pd.u:'p'}

let sw=null,busy=false;
function mkGhost(dir){

document.addEventListener('touchstart',e=>{
  if(busy||S.sheet||S.menu){sw=null;return}

  if(!sw)return;const t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;
  if(sw.h===null&&(Math.abs(dx)>8||Math.abs(dy)>8))sw.h=Math.abs(dx)>Math.abs(dy)*1.15;
  {const n=performance.now(),dt=n-sw.lt;if(dt>0){sw.v=.6*sw.v+.4*((t.clientX-sw.lx)/dt);sw.lt=n;sw.lx=t.clientX}}

function swEnd(cancel){

document.getElementById('imp').addEventListener('change',async e=>{

/* ---------- sincronização (GitHub, repositório privado) ---------- */
var SY={cfg:null,run:0,again:0,err:'',msg:'',last:0,t:0,cache:null};
const jstr=JSON.stringify;
function flat(){const r={};
  for(const k in D.entries)if(D.entries[k])r['e|'+k]=1;
  (D.tasks||[]).forEach(t=>{r['t|'+t.id]={day:t.day,text:t.text,done:!!t.done,dur:t.dur}});
  D.habits.forEach(h=>{r['h|'+h.id]={name:h.name,intent:h.intent,created:h.created,dur:h.dur}});
  r['o|']=D.habits.map(h=>h.id);
  r['s|sort']=D.sort===undefined?null:D.sort;
  r['s|ws']=D.weekStart===undefined?null:D.weekStart;
  return r}
function stamp(){const S2=D.sync||(D.sync={}),r=flat(),now=Date.now();
  for(const k in r){const c=S2[k];if(!c||jstr(c.v)!==jstr(r[k]))S2[k]={v:r[k],ts:now}}
  for(const k in S2){if(S2[k].v!==null&&!(k in r))S2[k]={v:null,ts:now}}}
function rebuild(){const S2=D.sync,E={},T=[],Hs={};let ord=[],sort,ws;
  for(const k in S2){const c=S2[k];if(c.v===null)continue;const p=k.slice(0,2),id=k.slice(2);
    if(p==='e|')E[id]=1;else if(p==='t|')T.push(Object.assign({id},c.v));else if(p==='h|')Hs[id]=Object.assign({id},c.v);
    else if(k==='o|')ord=c.v;else if(k==='s|sort')sort=c.v;else if(k==='s|ws')ws=c.v}
  const ids=ord.filter(i=>Hs[i]);Object.keys(Hs).sort().forEach(i=>{if(!ids.includes(i))ids.push(i)});
  D.habits=ids.map(i=>Hs[i]);
  D.entries={};for(const k in E)if(Hs[k.split('|')[0]])D.entries[k]=1;
  D.tasks=T.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
  if(sort===undefined||sort===null)delete D.sort;else D.sort=sort;
  if(ws===undefined||ws===null)delete D.weekStart;else D.weekStart=ws}
function mergeIn(rem){const S2=D.sync||(D.sync={});let ch=0;
  for(const k in rem){const a=S2[k],b=rem[k];if(!a||b.ts>a.ts){S2[k]=b;ch=1}}return ch}
const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const b64e=t=>{const u=new TextEncoder().encode(t);let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(b)};
const GH=(m,path,body,extra)=>fetch((SY.cfg.api||'https://api.github.com')+path,{method:m,headers:Object.assign({Authorization:'Bearer '+SY.cfg.tok,Accept:'application/vnd.github+json'},body?{'Content-Type':'application/json'}:{},extra||{}),body:body?jstr(body):undefined,cache:'no-store'});
const fpath=()=>'/repos/'+SY.cfg.repo+'/contents/rastro-data.json';
async function pull(){
  const r=await GH('GET',fpath(),null,SY.cache&&SY.cache.etag?{'If-None-Match':SY.cache.etag}:null);
  if(r.status===304&&SY.cache)return SY.cache;
  if(r.status===404){SY.cache=null;return {sha:null,rem:{}}}
  if(!r.ok)throw r.status;
  const j=await r.json();let txt;
  if(j.content&&j.encoding==='base64')txt=b64d(j.content);
  else{const rr=await GH('GET',fpath(),null,{Accept:'application/vnd.github.raw+json'});if(!rr.ok)throw rr.status;txt=await rr.text()}
  const c={etag:r.headers.get('ETag'),sha:j.sha,rem:(JSON.parse(txt).rec)||{}};SY.cache=c.etag?c:null;return c}
const errTxt=e=>e===401?'Token inválido ou expirado.':e===403?'Sem permissão no repositório (ou limite de uso). Confira o token.':e===404?'Repositório não encontrado para este token.':(typeof e==='number'?'Erro '+e+' do GitHub.':'Sem conexão com o GitHub.');
function uiRefresh(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName))return;if(typeof busy!=='undefined'&&busy)return;render()}
async function sync(){
  if(!SY.cfg||!navigator.onLine)return;
  if(SY.run){SY.again=1;return}
  SY.run=1;let changed=false;
  try{
    for(let n=0;n<3;n++){
      stamp();
      const {sha,rem}=await pull();
      if(mergeIn(rem)){rebuild();changed=true}
      const S2=D.sync;
      if(Object.keys(S2).some(k=>!rem[k]||S2[k].ts>rem[k].ts)){
        const p=await GH('PUT',fpath(),{message:'sync',content:b64e(jstr({v:1,rec:S2})),sha:sha||undefined});
        SY.cache=null;

        if(!p.ok)throw p.status}

    SY.last=Date.now();SY.err='';

  }catch(e){SY.err=errTxt(e);if(changed)await persist()}
  finally{SY.run=0;if(SY.again){SY.again=0;sync()}}}
async function connect(){
  const repo=document.getElementById('sr_repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,''),tok=document.getElementById('sr_tok').value.trim();
  const fail=m=>{SY.cfg=null;SY.msg=m;render()};
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||tok.length<20)return fail('Confira o repositório (dono/nome) e o token.');
  SY.cfg={repo,tok,api:window.RASTRO_API};SY.cache=null;SY.msg='Conectando…';render();
  try{
    const r=await GH('GET','/repos/'+repo);
    if(!r.ok)return fail(errTxt(r.status));
    const j=await r.json();
    if(!j.private)return fail('Este repositório é público. Use um repositório privado para seus dados.');
    const f=await pull();
    if(f.sha&&D.habits.length&&!confirm('Já existem dados na nuvem. Substituir os dados deste aparelho pelos da nuvem?'))return fail('Conexão cancelada.');
