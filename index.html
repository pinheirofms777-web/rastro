<body>
<div id="app"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script>
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MS=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const DL=['S','T','Q','Q','S','S','D'];
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addD=(d,n)=>{const x=sod(d);x.setDate(x.getDate()+n);return x};
const TODAY=sod(new Date());
const WS=()=>(D&&D.weekStart!==undefined)?D.weekStart:0;
const monday=d=>addD(d,-((d.getDay()-WS()+7)%7));
const DLF=['D','S','T','Q','Q','S','S'];
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}

function weekNum(m){if(WS()===1)return isoWeek(m);const sat=addD(m,6),y=sat.getFullYear(),j=new Date(y,0,1),f=addD(j,-j.getDay());return Math.round((m-f)/6048e5)+1}
/* ---------- estado ---------- */
let D={habits:[],entries:{},seq:1,tasks:[]};
/* ---------- armazenamento: IndexedDB ---------- */
const DB={open(){return new Promise((ok,no)=>{const r=indexedDB.open('rastro',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})},
  async get(k='data'){const db=await this.open();return new Promise((ok,no)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})},
  async set(v,k='data'){const db=await this.open();return new Promise((ok,no)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}};
let svT=0;const persist=()=>{try{stamp()}catch(e){}return DB.set(JSON.parse(JSON.stringify(D))).catch(()=>{})};
const flush=()=>{clearTimeout(svT);svT=0;snapUpd();wgUpd();fgUpd();persist();if(SY.cfg){clearTimeout(SY.t);SY.t=setTimeout(sync,1200)}};
const save=()=>{if(!svT)svT=setTimeout(flush,400)};
addEventListener('pagehide',()=>{if(svT)flush();if(SY.cfg){clearTimeout(SY.t);sync()}});
const WD=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const S={tab:'today',day:TODAY,ref:TODAY,anim:'',sheet:null,draft:'',intent:'build'};
const H=id=>D.habits.find(h=>h.id===id);
function list(){
  const m=D.sort||'green',a=[...D.habits],ix=h=>D.habits.indexOf(h),b=h=>h.intent==='build'?0:1;
  if(m==='green')a.sort((x,y)=>b(x)-b(y)||ix(x)-ix(y));

function canNext(){
  if(S.tab==='today')return key(S.day)<key(addD(TODAY,365));
  if(S.tab==='week')return key(monday(S.ref))<key(monday(TODAY));
  const ym=d=>d.getFullYear()*12+d.getMonth();
  if(S.tab==='month')return ym(S.ref)<ym(TODAY);
  return S.ref.getFullYear()<TODAY.getFullYear()}
function go(dir){
  if(dir>0&&!canNext())return false;
  if(S.tab==='today')S.day=addD(S.day,dir);
  else if(S.tab==='week')S.ref=addD(S.ref,7*dir);
  else S.ref=step(S.ref,S.tab,dir);
  return true}
function pagerHtml(){
  const ym=d=>d.getFullYear()*12+d.getMonth();
  const off=S.tab==='today'?Math.round((TODAY-S.day)/864e5):S.tab==='week'?Math.round((monday(TODAY)-monday(S.ref))/6048e5):S.tab==='month'?ym(TODAY)-ym(S.ref):TODAY.getFullYear()-S.ref.getFullYear();
  const on=((3-off)%4+4)%4;
  return `<div class="pager"><div>${[0,1,2,3].map(i=>`<i class="${i===on?'on':''}"></i>`).join('')}</div></div>`}
function parts(){
  const r=S.ref,t=S.tab;let sub='',title='',v='';
  if(t==='today'){const d=S.day,isT=key(d)===key(TODAY);const fut=key(d)>key(TODAY);sub=WD[d.getDay()]+(isT?' · '+pad(d.getDate())+' '+MS[d.getMonth()].toLowerCase():fut?' · planejado'+(d.getFullYear()!==TODAY.getFullYear()?' '+d.getFullYear():''):'');title=isT?'Hoje':fut&&key(d)===key(addD(TODAY,1))?'Amanhã':d.getDate()+' '+MS[d.getMonth()].toLowerCase();v=viewToday()}
  if(t==='week'){const mon=monday(r);const m2=addD(mon,6).getMonth();sub=MES[mon.getMonth()]+(m2!==mon.getMonth()?' / '+MES[m2]:'');title='Semana '+weekNum(mon);v=viewWeek()}
  if(t==='month'){sub=r.getFullYear();title=MES[r.getMonth()];v=viewMonth()}
  if(t==='year'){sub='';title=r.getFullYear();v=viewYear()}
  return {sub,title,v}}

function step(ref,mode,dir){
  if(mode==='week')return addD(ref,7*dir);
  if(mode==='month')return new Date(ref.getFullYear(),ref.getMonth()+dir,1);
  return new Date(ref.getFullYear()+dir,0,1)}

  else if(c.contains('gx')){const u=i.dataset.u,x=i.dataset.f,v=parseFloat(String(i.value).replace(',','.')),wh=i.dataset.w;

    const f=wh==='fgq'?S.fgq:S.fgo;if(!f)return;if(v>=0)fgxSet(f,u,x,v,wAt(f.d||f.start||key(TODAY))||0);render()}

  D.tasks=T.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);D.rec=Rs.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);D.prog={};for(const k in PR)if(Hs[k.split('|')[0]])D.prog[k]=PR[k];D.snap=SN;D.wl=WL;D.wgd=WX;wInit();if(wg>0){D.water.goal=wg;D.water.set=1}if(Array.isArray(wc)&&wc.length){D.water.cups=wc;D.water.set=1}D.fl=FL;D.fgd=FY;D.fgo=GO;D.fgr=FQ.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);D.st=ST.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);D.cf=CF;D.bw=BW;D.bc=BC;if(ht>0)D.ht=ht;else delete D.ht;if(sc>0)D.stc=sc;else delete D.stc;fInit();if(fg&&fg.k>0){D.food.goal=fg;D.food.set=1}
  if(sort===undefined||sort===null)delete D.sort;else D.sort=sort;
  if(ws===undefined||ws===null)delete D.weekStart;else D.weekStart=ws}
function mergeIn(rem){const S2=D.sync||(D.sync={});let ch=0;
  for(const k in rem){const a=S2[k],b=rem[k];if(!a||b.ts>a.ts){S2[k]=b;ch=1}}return ch}
const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const b64e=t=>{const u=new TextEncoder().encode(t);let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(b)};
const GH=(m,path,body,extra)=>fetch((SY.cfg.api||'https://api.github.com')+path,{method:m,headers:Object.assign({Authorization:'Bearer '+SY.cfg.tok,Accept:'application/vnd.github+json'},body?{'Content-Type':'application/json'}:{},extra||{}),body:body?jstr(body):undefined,cache:'no-store'});
const fpath=()=>'/repos/'+SY.cfg.repo+'/contents/rastro-data.json';
async function pull(){
  const r=await GH('GET',fpath(),null,SY.cache&&SY.cache.etag?{'If-None-Match':SY.cache.etag}:null);
  if(r.status===304&&SY.cache)return SY.cache;
  if(r.status===404){SY.cache=null;return {sha:null,rem:{}}}
  if(!r.ok)throw r.status;
  const j=await r.json();let txt;
  if(j.content&&j.encoding==='base64')txt=b64d(j.content);
  else{const rr=await GH('GET',fpath(),null,{Accept:'application/vnd.github.raw+json'});if(!rr.ok)throw rr.status;txt=await rr.text()}
  const c={etag:r.headers.get('ETag'),sha:j.sha,rem:(JSON.parse(txt).rec)||{}};SY.cache=c.etag?c:null;return c}
const errTxt=e=>e===401?'Token inválido ou expirado.':e===403?'Sem permissão no repositório (ou limite de uso). Confira o token.':e===404?'Repositório não encontrado para este token.':(typeof e==='number'?'Erro '+e+' do GitHub.':'Sem conexão com o GitHub.');
function uiRefresh(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName))return;if(typeof busy!=='undefined'&&busy)return;render()}
async function sync(){
  if(!SY.cfg||!navigator.onLine)return;
  if(SY.run){SY.again=1;return}
  SY.run=1;let changed=false;
  try{
    if(migrate())changed=true;
    for(let n=0;n<3;n++){
      stamp();
      const {sha,rem}=await pull();
      if(mergeIn(rem)){rebuild();changed=true}
      const S2=D.sync;
      if(Object.keys(S2).some(k=>!rem[k]||S2[k].ts>rem[k].ts)){
        const p=await GH('PUT',fpath(),{message:'sync',content:b64e(jstr({v:1,rec:S2})),sha:sha||undefined});
        SY.cache=null;
        if(p.status===409||p.status===422){if(n===2)throw 409;continue}
        if(!p.ok)throw p.status}
      break}
    SY.last=Date.now();SY.err='';
    if(changed){await persist();uiRefresh()}else if(ensureDay(key(S.day)))uiRefresh();
  }catch(e){SY.err=errTxt(e);if(changed)await persist()}
  finally{SY.run=0;if(SY.again){SY.again=0;sync()}}}
async function connect(){
  const repo=document.getElementById('sr_repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,''),tok=document.getElementById('sr_tok').value.trim();
  const fail=m=>{SY.cfg=null;SY.msg=m;render()};
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||tok.length<20)return fail('Confira o repositório (dono/nome) e o token.');
  SY.cfg={repo,tok,api:window.RASTRO_API};SY.cache=null;SY.msg='Conectando…';render();
  try{
    const r=await GH('GET','/repos/'+repo);
    if(!r.ok)return fail(errTxt(r.status));
    const j=await r.json();
    if(!j.private)return fail('Este repositório é público. Use um repositório privado para seus dados.');
    const f=await pull();
    if(f.sha&&D.habits.length&&!confirm('Já existem dados na nuvem. Substituir os dados deste aparelho pelos da nuvem?'))return fail('Conexão cancelada.');
    if(f.sha){D={habits:[],entries:{},seq:1,tasks:[],sync:{}}}
    await DB.set(SY.cfg,'cfg');SY.msg='';
    await sync();
    if(SY.err){const m=SY.err;DB.set(null,'cfg').catch(()=>{});return fail(m)}
    render()
  }catch(e){fail(errTxt(e))}}
addEventListener('online',()=>sync());
setInterval(()=>{if(!document.hidden)sync()},45000);
(async()=>{try{const d=await DB.get();if(d&&Array.isArray(d.habits))D=d}catch(e){}
  try{SY.cfg=(await DB.get('cfg'))||null}catch(e){}
  if(!Array.isArray(D.tasks))D.tasks=[];if(!Array.isArray(D.rec))D.rec=[];if(!D.prog||typeof D.prog!=='object')D.prog={};if(!D.snap||typeof D.snap!=='object')D.snap={};wInit();fInit();
  try{if(migrate())await DB.set(JSON.parse(JSON.stringify(D)))}catch(e){}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  render();if(SY.cfg)sync()})();
</script>
